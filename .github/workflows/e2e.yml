name: e2e
# Playwright (desktop + mobile) on PRs and pushes to main and phase-*. `pull_request` only, never
# `pull_request_target`: fork PRs get no secrets, so they run against scripture-fixtures/.
on:
  pull_request:
    branches: [main, 'phase-*']
  push:
    branches: [main, 'phase-*']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BK_SEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Astro 7 needs >= 22.23.4; the runner's cached 22.x can be older.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch scripture
        env:
          SCRIPTURE_TOKEN: ${{ secrets.SCRIPTURE_TOKEN }}
        run: scripts/fetch-scripture.sh
      - name: Install Playwright browser (CI runners have none)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The chart performance budgets (P2-S3-T7): stress seed, 4× CPU. Slow, so on pushes to
      # phase-* only, not on PRs. Not blocking until P5-S2-T1 settles SVG vs Canvas for the
      # streams: today's SVG numbers miss the frame budget on the stress seed (e2e/perf/README.md).
      - name: Perf budgets (pushes to phase-* only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase-')
        continue-on-error: true
        run: pnpm perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # The perf report (frame deltas, JS sizes, LCP), kept whether or not the budgets were met.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase-')
        with:
          name: perf-report
          path: playwright-report/perf/
          retention-days: 30
          if-no-files-found: ignore
